[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "agentstats"
version = "0.2.0"
description = "Run-to-run variance, significance tests and minimum-runs planning for AI agent benchmarks"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Rishabh Pande" }]
keywords = ["agents", "benchmarks", "evaluation", "statistics", "reproducibility", "swe-bench", "webarena", "osworld"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.22", "scipy>=1.8", "pandas>=1.4", "tabulate>=0.8"]

[project.optional-dependencies]
test = ["pytest>=7", "pyyaml>=5"]
swebench = ["pyyaml>=5"]

[project.scripts]
agentstats = "agentstats.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentstats"]
