name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    # Python 3.9 builds are unavailable for Ubuntu 26.04.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: pytest -q
  git-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install straight from this commit, as the README says
        run: |
          pip install "agentstats @ git+https://github.com/${{ github.repository }}.git@${{ github.sha }}"
          agentstats --help
